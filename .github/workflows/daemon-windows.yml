# Native Windows gate for the installer (MW-T11): install.ps1 under Windows PowerShell 5.1 against a
# fake tarball server. The Rust daemon's own Windows build, tests and e2e run in daemon-rust.yml
# (ADR-0026); the TS daemon tests this job used to run were deleted with it (MR-T18b). The workflow
# and job names stay, so the PR check it reports keeps its name.
#
# Diff-aware: `changes` (cheap, on Linux) asks scripts/test-affected.js whether the diff reaches
# the installer, what renders it, or the toolchain its test runs on, and `test` (TD-194) runs only
# then. A pnpm-lock.yaml change counts only if it changed what the root toolchain resolves. A
# skipped `test` reports SKIPPED, which the PR-CI gate passes.
name: daemon-windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run; runs on main are never cancelled.
concurrency:
  group: daemon-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      installer: ${{ steps.affected.outputs.installer }}
    steps:
      # Full history: the base commit has to be here to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile # the lockfile parser (yaml)
      # A PR is checked out as its merge commit: its first parent is the base side, so the diff is
      # exactly the PR. A push compares with the commit main was at before it. A dispatch runs.
      - name: scripts/test-affected.js
        id: affected
        env:
          # Through env, never interpolated into the script.
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) installer="$(node scripts/test-affected.js installer --base "$(git rev-parse HEAD^1)")" ;;
            push) installer="$(node scripts/test-affected.js installer-main --base "$BEFORE")" ;;
            *) installer=true ;;
          esac
          echo "installer=$installer" >>"$GITHUB_OUTPUT"
          if [[ "$installer" != true ]]; then
            echo "::notice::nothing the Windows installer is built or tested from changed; skipping the Windows tests"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    # A dedicated runner: no machine-wide test slots, so vitest uses every CPU (M2-T31).
    env:
      CONDUCTOR_TEST_SLOTS: '0'
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      # As the `ci` workflow: pnpm from package.json `packageManager` (never corepack), Node from
      # .nvmrc, the pnpm store cached between runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MW-T11: install.ps1 under Windows PowerShell 5.1 against a fake tarball server (no DB).
      - run: pnpm vitest run --project orchestrator test/install-ps1.test.ts
