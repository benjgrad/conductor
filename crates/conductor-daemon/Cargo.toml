[package]
name = "conductor-daemon"
description = "The conductor daemon, in Rust (ADR-0026). The TS daemon in packages/daemon is the behaviour reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "conductor_daemon"
path = "src/lib.rs"

[[bin]]
name = "conductor-daemon"
path = "src/main.rs"

# Every dependency MR needs, referenced now (MR-T02) so later tickets never edit this file or
# Cargo.lock in parallel.
[dependencies]
conductor-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Test support (src/test_support/) is compiled into the lib so tests/*.rs can use it.
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
