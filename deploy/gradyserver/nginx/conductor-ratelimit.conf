# http context: installed as /etc/nginx/conf.d/conductor-ratelimit.conf by install-nginx-site.sh.
# Follows gradyserver's <app>-ratelimit.conf pattern (e.g. reso-ratelimit.conf), with
# conductor_-prefixed zone names. Used by sites-available/conductor.gradyserver.com.

# Sign-in, sign-up, resets and machine enrollment (/auth/*, /api/machines/enroll).
limit_req_zone $binary_remote_addr zone=conductor_auth:10m rate=5r/m;

# Everything else (API, web app, SSE connects).
limit_req_zone $binary_remote_addr zone=conductor_general:10m rate=20r/s;
