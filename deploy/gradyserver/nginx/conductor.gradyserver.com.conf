# /etc/nginx/sites-available/conductor.gradyserver.com (M2-T07; ADR-0017 §Hosting topology).
# Installed by install-nginx-site.sh. Needs, in conf.d: conductor-ratelimit.conf (zones
# conductor_auth, conductor_general) and conductor-websocket.conf ($conductor_connection_upgrade).

upstream conductor_app {
    # Must equal CONDUCTOR_HOST_PORT in ~/deploy/conductor/.env (compose default 3040).
    server 127.0.0.1:3040;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name conductor.gradyserver.com;

    # certbot --webroot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name conductor.gradyserver.com;

    ssl_certificate /etc/letsencrypt/live/conductor.gradyserver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conductor.gradyserver.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/conductor.gradyserver.com.access.log;
    error_log /var/log/nginx/conductor.gradyserver.com.error.log;

    client_max_body_size 4m;

    # Security headers. The orchestrator sets CSP, nosniff and Referrer-Policy itself (ADR-0017
    # §Headers); nginx adds the rest. Keep every add_header here: an add_header inside a location
    # would drop all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Common proxy settings. proxy_set_header inherits all-or-nothing: a location that sets any
    # proxy_set_header must repeat all five forwarding headers.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    # Daemon WebSocket (/ws/daemon).
    location /ws/ {
        proxy_pass http://conductor_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conductor_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Server-sent events (board and session output streams).
    location /api/stream/ {
        limit_req zone=conductor_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://conductor_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Sign-in, sign-up, resets, machine enrollment: the strict zone.
    location ~ ^/(auth/|api/machines/enroll) {
        limit_req zone=conductor_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://conductor_app;
    }

    location / {
        limit_req zone=conductor_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://conductor_app;
    }
}
