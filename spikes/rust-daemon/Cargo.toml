[package]
name = "rust-daemon-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "MR-T01 throwaway spike: WS, rmcp and Job Object risk probes for a Rust conductor daemon. Never shipped."

# Its own workspace, so a future root workspace never absorbs this spike.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "signal", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = "0.5.3"
uuid = { version = "1.29.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# What a shipped daemon would use, so the binary sizes mean something.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
